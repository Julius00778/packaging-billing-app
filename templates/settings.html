{% extends "base.html" %}
{% set active = "settings" %}
{% block title %}{{ t('nav_settings') }}{% endblock %}
{% block content %}

<div class="card panel-pad">
<h2 class="section-title">{{ t('firm_settings') }}</h2>
<p class="section-sub">{{ t('settings_sub') }}</p>
<form method="POST">
<div class="form-grid">
<div class="field"><label>{{ t('firm_name') }}</label><input type="text" name="firm_name" value="{{ s.firm_name }}"></div>
<div class="field"><label>{{ t('phone') }}</label><input type="text" name="phone" value="{{ s.phone }}"></div>
</div>
<div class="field"><label>{{ t('address') }}</label><input type="text" name="address" value="{{ s.address }}"></div>
<div class="form-grid">
<div class="field"><label>GSTIN</label><input type="text" name="gstin" value="{{ s.gstin }}"></div>
<div class="field">
<label>{{ t('state') }}</label>
<select name="state">
<option value="">{{ t('select_state') }}</option>
{% for st in state_names %}
<option value="{{ st }}" {% if st==s.state %}selected{% endif %}>{{ st }}</option>
{% endfor %}
</select>
</div>
</div>
<div class="divider"></div>
<div class="form-grid three">
<div class="field"><label>{{ t('bank_name') }}</label><input type="text" name="bank_name" value="{{ s.bank_name }}"></div>
<div class="field"><label>{{ t('account_no') }}</label><input type="text" name="bank_acc" value="{{ s.bank_acc }}"></div>
<div class="field"><label>{{ t('ifsc') }}</label><input type="text" name="ifsc" value="{{ s.ifsc }}"></div>
</div>
<div class="divider"></div>
<div class="form-grid">
<div class="field"><label>{{ t('invoice_prefix') }}</label><input type="text" name="invoice_prefix" value="{{ s.invoice_prefix }}"></div>
<div class="field"><label>{{ t('next_invoice_no') }}</label><input type="number" name="next_invoice_no" value="{{ s.next_invoice_no }}"></div>
</div>
<div class="btn-row"><button class="btn btn-primary" type="submit">{{ t('save_settings') }}</button></div>
</form>
</div>

{% endblock %}
