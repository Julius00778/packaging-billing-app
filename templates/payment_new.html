{% extends "base.html" %}
{% set active = "accounts" %}
{% block title %}{{ t('voucher_payment_received') }}{% endblock %}
{% block content %}

<div class="toolbar">
<a class="btn btn-ghost" href="{{ url_for('payments_page') }}">← {{ t('recent_payments') }}</a>
</div>

<div class="card panel-pad">
<h2 class="section-title">{{ t('record_payment') }}</h2>
<p class="section-sub">{{ t('record_payment_sub') }}</p>
<form method="POST">
<div class="form-grid three">
<div class="field">
<label>{{ t('customer') }} *</label>
<select name="customer_id" required>
<option value="">{{ t('select_customer') }}</option>
{% for c in customers %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
</select>
</div>
<div class="field"><label>{{ t('amount') }} *</label><input type="number" step="0.01" min="0.01" name="amount" required></div>
<div class="field"><label>{{ t('date') }}</label><input type="date" name="date" value="{{ today }}"></div>
</div>
<div class="form-grid">
<div class="field">
<label>{{ t('method') }}</label>
<select name="method">
<option value="cash">{{ t('cash') }}</option>
<option value="bank">{{ t('bank') }}</option>
<option value="upi">{{ t('upi') }}</option>
<option value="cheque">{{ t('cheque') }}</option>
<option value="other">{{ t('other') }}</option>
</select>
</div>
<div class="field"><label>{{ t('note') }}</label><input type="text" name="note"></div>
</div>
<div class="btn-row"><button class="btn btn-primary" type="submit">{{ t('save') }}</button></div>
</form>
</div>

{% endblock %}
