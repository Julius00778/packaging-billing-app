<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Invoice {{ inv.invoice_no }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

{% from "invoice_copy.html" import render_copy with context %}

<div class="pinv-page">
{{ render_copy(inv, settings, t('party_copy')) }}
<div class="cut-line no-print"><span>- - - - - - - - - - - - {{ t('cut_here') }} - - - - - - - - - - - -</span></div>
{{ render_copy(inv, settings, t('office_copy')) }}
</div>

<div class="print-trigger no-print">
<button class="btn btn-primary" onclick="window.print()">{{ t('print_2copy_btn') }}</button>
<a class="btn btn-primary" href="{{ url_for('invoice_pdf', invid=inv.id) }}">{{ t('download_pdf_btn') }}</a>
<button class="btn btn-ghost" type="button" onclick="if(document.referrer && document.referrer.indexOf(window.location.host) !== -1){history.back();}else{window.location='{{ url_for('invoices') }}';}">{{ t('back_to_invoices') }}</button>
</div>

</body>
</html>
