{% extends "base.html" %}
{% set active = "customers" %}
{% block title %}{{ t('edit_customer') }}{% endblock %}
{% block content %}
<div class="card panel-pad">
<h2 class="section-title">{{ t('edit_customer') }}</h2>
<form method="POST">
<div class="form-grid three">
<div class="field"><label>{{ t('customer_name') }} *</label><input type="text" name="name" value="{{ customer.name }}" required></div>
<div class="field"><label>{{ t('phone') }}</label><input type="text" name="phone" value="{{ customer.phone }}"></div>
<div class="field"><label>{{ t('gstin_optional') }}</label><input type="text" name="gstin" value="{{ customer.gstin }}"></div>
</div>
<div class="form-grid">
<div class="field"><label>{{ t('address') }}</label><input type="text" name="address" value="{{ customer.address }}"></div>
<div class="field">
<label>{{ t('state') }}</label>
<select name="state">
<option value="">{{ t('select_state') }}</option>
{% for st in state_names %}
<option value="{{ st }}" {% if st==customer.state %}selected{% endif %}>{{ st }}</option>
{% endfor %}
</select>
</div>
</div>
<div class="form-grid">
<div class="field"><label>{{ t('opening_balance') }} (₹)</label><input type="number" step="0.01" name="opening_balance" value="{{ customer.opening_balance }}"></div>
<div class="field"><label>{{ t('default_credit_days') }}</label><input type="number" name="credit_days" value="{{ customer.credit_days }}"></div>
</div>
<div class="btn-row">
<button class="btn btn-primary" type="submit">{{ t('save') }}</button>
<a class="btn btn-ghost" href="{{ url_for('customers') }}">{{ t('cancel') }}</a>
</div>
</form>
</div>
{% endblock %}
