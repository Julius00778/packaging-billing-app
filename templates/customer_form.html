{% extends "base.html" %}
{% set active = "customers" %}
{% block title %}Edit Customer{% endblock %}
{% block content %}
<div class="card panel-pad">
  <h2 class="section-title">Edit Customer</h2>
  <form method="POST">
    <div class="form-grid three">
      <div class="field"><label>Customer Name *</label><input type="text" name="name" value="{{ customer.name }}" required></div>
      <div class="field"><label>Phone</label><input type="text" name="phone" value="{{ customer.phone }}"></div>
      <div class="field"><label>GSTIN (optional)</label><input type="text" name="gstin" value="{{ customer.gstin }}"></div>
    </div>
    <div class="form-grid">
      <div class="field"><label>Address</label><input type="text" name="address" value="{{ customer.address }}"></div>
      <div class="field">
        <label>State</label>
        <select name="state">
          <option value="">-- Select State --</option>
          {% for st in state_names %}
            <option value="{{ st }}" {% if st==customer.state %}selected{% endif %}>{{ st }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" type="submit">Save Changes</button>
      <a class="btn btn-ghost" href="{{ url_for('customers') }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
