{% extends "base.html" %}
{% set active = "po" %}
{% block title %}{{ t('po_new_order') }}{% endblock %}
{% block content %}

<div class="toolbar">
  <div style="flex:1;font-weight:600;">{{ t('po_new_order') }}</div>
  <a class="btn btn-ghost" href="{{ url_for('po.po_list') }}">{{ t('po_back') }}</a>
</div>

<form method="POST" enctype="multipart/form-data">
  <div class="card panel-pad">
    <div class="form-grid three">
      <div class="field">
        <label>{{ t('po_party') }} *</label>
        <select name="customer_id" required>
          <option value="">{{ t('po_select') }}</option>
          {% for c in customers %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
        </select>
      </div>
      <div class="field">
        <label>{{ t('po_order_number') }} *</label>
        <input type="text" name="po_number" required placeholder="PO-4471">
      </div>
      <div class="field">
        <label>{{ t('po_order_date') }}</label>
        <input type="date" name="po_date" value="{{ today }}">
      </div>
    </div>

    <div class="form-grid three">
      <div class="field">
        <label>{{ t('po_sizes_written_in') }}</label>
        <select name="size_unit">
          <option value="inch">{{ t('po_unit_inch') }}</option>
          <option value="mm">{{ t('po_unit_mm') }}</option>
          <option value="cm">{{ t('po_unit_cm') }}</option>
        </select>
      </div>
      <div class="field">
        <label>{{ t('po_came_from') }}</label>
        <select name="source">
          <option value="upload">{{ t('po_src_upload') }}</option>
          <option value="email">{{ t('po_src_email') }}</option>
          <option value="whatsapp">{{ t('po_src_whatsapp') }}</option>
          <option value="manual">{{ t('po_src_manual') }}</option>
        </select>
      </div>
      <div class="field">
        <label>{{ t('po_scan_label') }}</label>
        <input type="file" name="scan" accept="image/*,application/pdf">
      </div>
    </div>

    <div class="field">
      <label>{{ t('po_lines_label') }} *</label>
      <textarea name="raw_text" rows="8" required
                placeholder="{{ t('po_lines_placeholder') }}"></textarea>
      <div style="font-size:12px;color:var(--ink-faint);">{{ t('po_lines_hint') }}</div>
    </div>

    <div class="field">
      <label>{{ t('po_note_optional') }}</label>
      <input type="text" name="note" placeholder="{{ t('po_note_placeholder') }}">
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" type="submit">{{ t('po_read_order') }}</button>
      <a class="btn btn-ghost" href="{{ url_for('po.po_list') }}">{{ t('cancel') }}</a>
    </div>
  </div>
</form>

{% endblock %}
