<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ t('setup_title') }} — Firm Billing</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ asset_v('style.css') }}">
</head>
<body>
<div class="auth-wrap">
<div class="lang-switch" style="justify-content:center;margin-bottom:14px;">
<a href="{{ url_for('set_lang', code='en') }}" class="{% if current_lang=='en' %}active{% endif %}">EN</a>
<span>/</span>
<a href="{{ url_for('set_lang', code='hi') }}" class="{% if current_lang=='hi' %}active{% endif %}">हिं</a>
</div>
<div class="card">
<h1>{{ t('setup_title') }}</h1>
<p class="sub">{{ t('setup_sub') }}</p>
{% with messages = get_flashed_messages(with_categories=true) %}
{% for category, message in messages %}
<div class="flash {{ category }}">{{ message }}</div>
{% endfor %}
{% endwith %}
<form method="POST">{{ csrf_field() }}
<h3 class="settings-sec-title" style="margin-top:0;">{{ t('firm_account_section') }}</h3>
<div class="field"><label for="firm_name">{{ t('firm_name') }}</label><input type="text" id="firm_name" name="firm_name" required autocomplete="organization"></div>
<div class="field"><label for="address">{{ t('address') }}</label><input type="text" id="address" name="address" autocomplete="street-address"></div>
<div class="field"><label for="gstin">{{ t('gstin_optional') }}</label><input type="text" id="gstin" name="gstin" autocapitalize="characters" spellcheck="false"></div>
<div class="field"><label for="phone">{{ t('phone') }}</label><input type="tel" id="phone" name="phone" inputmode="tel" autocomplete="tel"></div>

<div class="divider"></div>
<h3 class="settings-sec-title">{{ t('owner_login_section') }}</h3>
<div class="field"><label for="name">{{ t('your_name') }}</label><input type="text" id="name" name="name" required autocomplete="name"></div>
<div class="field"><label for="username">{{ t('username') }}</label><input type="text" id="username" name="username" required autocomplete="username" autocapitalize="none" spellcheck="false"></div>
<div class="field"><label for="password">{{ t('password_min') }}</label><input type="password" id="password" name="password" required autocomplete="new-password"></div>
<div class="btn-row"><button class="btn btn-primary" type="submit" style="width:100%;">{{ t('create_account_btn') }}</button></div>
</form>
</div>
</div>
</body>
</html>
