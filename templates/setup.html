<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setup — Firm Billing</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="auth-wrap">
  <div class="card">
    <h1>Pehla Owner Account Banayein</h1>
    <p class="sub">Ye account aapko full access dega — settings, users, sab kuch.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    <form method="POST">
      <div class="field"><label>Aapka Naam</label><input type="text" name="name" required></div>
      <div class="field"><label>Username</label><input type="text" name="username" required></div>
      <div class="field"><label>Password (min 6 characters)</label><input type="password" name="password" required></div>
      <div class="btn-row"><button class="btn btn-primary" type="submit" style="width:100%;">Account Banayein</button></div>
    </form>
  </div>
</div>
</body>
</html>
