<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ t('login_title') }} — Firm Billing</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ asset_v('style.css') }}">
</head>
<body>
<div class="auth-wrap">
<div class="lang-switch" style="justify-content:center;margin-bottom:14px;">
<a href="{{ url_for('set_lang', code='en') }}" class="{% if current_lang=='en' %}active{% endif %}">EN</a>
<span>/</span>
<a href="{{ url_for('set_lang', code='hi') }}" class="{% if current_lang=='hi' %}active{% endif %}">हिं</a>
</div>
<div class="card">
<h1>{{ t('login_title') }}</h1>
<p class="sub">{{ t('login_sub') }}</p>
{% with messages = get_flashed_messages(with_categories=true) %}
{% for category, message in messages %}
<div class="flash {{ category }}">{{ message }}</div>
{% endfor %}
{% endwith %}
<form method="POST">
<div class="field">
<label>{{ t('login_as') }}</label>
<input type="hidden" name="role" id="role_input" value="owner">
<div class="btn-row" style="gap:8px;" role="group" aria-label="{{ t('login_as') }}">
<button type="button" class="btn btn-ghost active" id="role_owner_btn" style="flex:1;" aria-pressed="true" onclick="setLoginRole('owner')">{{ t('role_admin') }}</button>
<button type="button" class="btn btn-ghost" id="role_staff_btn" style="flex:1;" aria-pressed="false" onclick="setLoginRole('staff')">{{ t('staff') }}</button>
</div>
</div>
<div class="field"><label for="username">{{ t('username') }}</label>
<input type="text" id="username" name="username" required autofocus
       autocomplete="username" autocapitalize="none" spellcheck="false"></div>
<div class="field"><label for="password">{{ t('password') }}</label>
<input type="password" id="password" name="password" required
       autocomplete="current-password"></div>
<div class="btn-row"><button class="btn btn-primary" type="submit" style="width:100%;">{{ t('login_btn') }}</button></div>
</form>
<script>
function setLoginRole(role) {
    document.getElementById('role_input').value = role;
    var o = document.getElementById('role_owner_btn');
    var st = document.getElementById('role_staff_btn');
    o.classList.toggle('active', role === 'owner');
    st.classList.toggle('active', role === 'staff');
    o.setAttribute('aria-pressed', role === 'owner' ? 'true' : 'false');
    st.setAttribute('aria-pressed', role === 'staff' ? 'true' : 'false');
}
</script>
</div>
</div>
</body>
</html>
