<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ t('login_title') }} — Firm Billing</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ asset_v('style.css') }}">
</head>
<body>
<div class="auth-wrap">
<div class="lang-switch" style="justify-content:center;margin-bottom:14px;">
<a href="{{ url_for('set_lang', code='en') }}" class="{% if current_lang=='en' %}active{% endif %}">EN</a>
<span>/</span>
<a href="{{ url_for('set_lang', code='hi') }}" class="{% if current_lang=='hi' %}active{% endif %}">हिं</a>
</div>
<div class="card">
<h1>{{ t('login_title') }}</h1>
<p class="sub">{{ t('login_sub') }}</p>
{% with messages = get_flashed_messages(with_categories=true) %}
{% for category, message in messages %}
<div class="flash {{ category }}">{{ message }}</div>
{% endfor %}
{% endwith %}
<form method="POST">
<div class="field">
<label>{{ t('login_as') }}</label>
<input type="hidden" name="role" id="role_input" value="owner">
<div class="btn-row" style="gap:8px;">
<button type="button" class="btn btn-ghost active" id="role_owner_btn" style="flex:1;" onclick="setLoginRole('owner')">{{ t('role_admin') }}</button>
<button type="button" class="btn btn-ghost" id="role_staff_btn" style="flex:1;" onclick="setLoginRole('staff')">{{ t('staff') }}</button>
</div>
</div>
<div class="field"><label>{{ t('username') }}</label><input type="text" name="username" required autofocus></div>
<div class="field"><label>{{ t('password') }}</label><input type="password" name="password" required></div>
<div class="btn-row"><button class="btn btn-primary" type="submit" style="width:100%;">{{ t('login_btn') }}</button></div>
</form>
<script>
function setLoginRole(role) {
    document.getElementById('role_input').value = role;
    document.getElementById('role_owner_btn').classList.toggle('active', role === 'owner');
    document.getElementById('role_staff_btn').classList.toggle('active', role === 'staff');
}
</script>
</div>
</div>
</body>
</html>
